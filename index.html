<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite de Aniversário</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ballet:opsz@16..72&family=Crafty+Girls&family=Lavishly+Yours&display=swap" rel="stylesheet">

    <style>
        body {
            background: #000000;
            color: #2a9d8f;
            font-family: 'Crafty Girls', cursive;
            margin: 20px;
            text-align: center;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 500px;
            margin: 24px auto;
            padding: 30px 24px;
            box-sizing: border-box;
            background: #000000;
            border: 3px dashed #2a9d8f;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(42, 157, 143, 0.35);
        }

        h1 {
            color: #2a9d8f;
            font-size: clamp(2rem, 8vw, 3rem);
            margin: 0;
        }

        h2 {
            color: #16877d;
        }

        .mensagem-convite {
            margin: 0 0 8px;
            font-size: 1.15rem;
        }

        form {
            display: grid;
            gap: 10px;
            width: 100%;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            background-color: #2a9d8f;
            color: #000000;
            border: 2px solid #2a9d8f;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(42, 157, 143, 0.35);
        }

        label, section {
            text-align: center;
        }

        input, button {
            padding: 10px;
            color: #1f1f1f;
            font-family: inherit;
        }

        button {
            background: #2a9d8f;
            border: 2px solid #000000;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            background-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(42, 157, 143, 0.35);
        }

        input {
            border: 2px solid #2a9d8f;
            border-radius: 10px;
            background-color: #b8e3df;
            box-shadow: 0 3px 8px rgba(74, 51, 35, 0.16);
        }

        label[for="cor"] {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 8px;
            background-color: #2a9d8f;
            font-size: 1.15rem;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(42, 157, 143, 0.3);
        }

        #cor {
            width: 100%;
            height: 60px;
            padding: 5px;
            border: 3px solid #2a9d8f;
            cursor: pointer;
        }

        #nome, #nascimento {
            background-color: #b8e3df;
            transition: background-color 0.2s ease;
        }

        #nome:hover, #nascimento:hover {
            background-color: #d9f0ed;
        }

        #resultado {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <main>
        <h1>Você está convidado!</h1>
        <p class="mensagem-convite">Venha comemorar um dia muito especial comigo! Confirme seus dados abaixo.</p>

        <form id="formulario">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>

            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento" required>

            <label for="cor">Cor de fundo:</label>
            <input type="color" id="cor" value="#dbeafe">

            <button type="submit">Confirmar presença</button>
        </form>

        <section>
            <h2>Sua confirmação</h2>
            <div id="resultado"></div>
        </section>
    </main>

    <script>
        const formulario = document.getElementById("formulario");
        const resultado = document.getElementById("resultado");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            const nome = document.getElementById("nome").value;
            const nascimento = document.getElementById("nascimento").value;
            const cor = document.getElementById("cor").value;
            document.body.style.backgroundColor = cor;

            resultado.innerHTML = "";

            const pNome = document.createElement("p");
            pNome.textContent = "Nome: " + nome;

            const pNascimento = document.createElement("p");
            const dataFormatada = new Date(nascimento + "T00:00:00").toLocaleDateString("pt-BR");
            pNascimento.textContent = "Data de nascimento: " + dataFormatada;

            const pCor = document.createElement("p");
            pCor.textContent = "Cor de fundo: " + cor;

            const amostraCor = document.createElement("div");
            amostraCor.style.backgroundColor = cor;
            amostraCor.style.width = "min(100%, 260px)";
            amostraCor.style.height = "80px";
            amostraCor.style.border = "3px solid #0312a0";
            amostraCor.style.borderRadius = "12px";
            amostraCor.style.boxShadow = "0 4px 12px rgba(3, 18, 160, 0.3)";

            resultado.appendChild(pNome);
            resultado.appendChild(pNascimento);
            resultado.appendChild(pCor);
            resultado.appendChild(amostraCor);
        });
    </script>

</body>
</html>
